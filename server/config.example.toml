# Hearth config. Installed as /etc/hearth/config.toml (root:hearth 640). Everything machine-specific lives here,
# never in the repo.

# server (the default): the backend the app talks to. agent: a second machine the server watches; see the end of
# this file for what an agent's config needs.
role = "server"

# How this machine is labelled in the app and in alerts. Defaults to the hostname.
name = "box"

# The Tailscale login allowed to use the API. Tailscale Serve adds a Tailscale-User-Login header to every request
# from a tailnet device; requests without this exact value are refused. Leave empty to turn the check off (tests,
# local development only).
owner = "you@github"

db = "/var/lib/hearth/hearth.db"
token_file = "/etc/hearth/token"

# Mount points to watch.
disks = ["/"]

# Disks whose SMART health to show and alert on. Needs smartmontools; install.sh adds a root timer that saves
# smartctl's output for Hearth to read. Leave empty to skip.
smart = []

# Seconds between samples.
[sample]
system = 30
services = 30
games = 60
network = 60
public_ip = 600

# Every unit Hearth knows about. group is the section it's listed under in the app. actions: none | restart | full
# (start/stop/restart). Units that would cut the app off (ssh, tailscaled, the Hearth host itself) should stay none.
# cgroup: read CPU and memory from another cgroup instead of the unit's own (a glob; for units that start a
# container, whose processes live in docker-<id>.scope).
[[service]]
unit = "ssh"
name = "SSH"
group = "Network"
actions = "none"

[[service]]
unit = "tailscaled"
name = "Tailscale"
group = "Network"
actions = "none"

[[service]]
unit = "pihole-FTL"
name = "Pi-hole"
group = "Network"
actions = "restart"

[[service]]
unit = "minecraft"
name = "Minecraft"
group = "Games"
actions = "full"

[[service]]
unit = "valheim"
name = "Valheim"
group = "Games"
actions = "full"

[[service]]
unit = "some-web-app"
name = "Web app"
group = "Apps"
actions = "restart"

[[service]]
unit = "remote-desktop"
name = "Remote desktop"
group = "Desktop"
actions = "full"
cgroup = "/sys/fs/cgroup/system.slice/docker-*.scope"

[[service]]
unit = "cellar-backup.timer"
name = "Nightly backup"
group = "Backups"
actions = "none"

# Game servers. unit must also be listed under [[service]]. address is what the app shows and copies.
# Minecraft can be vanilla, Fabric or NeoForge: the version and loader are read from the startup log.
[[game]]
id = "mc1"
kind = "minecraft"
name = "My world"
unit = "minecraft"
address = "example.com:25565"
rcon_port = 25575
rcon_password = ""

[[game]]
id = "valheim"
kind = "valheim"
name = "My Valheim world"
unit = "valheim"
address = "example.com:2456"
# Folder holding adminlist.txt, permittedlist.txt and bannedlist.txt.
lists_dir = "/home/you/.config/unity3d/IronGate/Valheim"

[pihole]
url = "http://127.0.0.1"
# An app password (Settings → Web interface / API → Configure app password), not the admin password.
# Empty = the Pi-hole card shows "not configured".
password = ""

[cellar]
status = "/var/lib/cellar/status.json"

# Where the public IP is looked up.
[public_ip]
url = "https://api.ipify.org"

# Alert thresholds.
[rules]
disk_warn = 85
disk_crit = 95
ram_pct = 90
ram_minutes = 5
temp_c = 90
battery_low = 30
flap_restarts = 3
flap_minutes = 15
tailscale_expiry_days = 14
backup_max_age_hours = 36
check_max_age_days = 8
drill_max_age_days = 33

# Notifications through ntfy (the free ntfy iOS app, subscribed to the same topic). Use a long random topic: anyone
# who knows it can read the messages, which is why they stay vague ("valheim is down", never IPs or names).
[alerts]
ntfy_url = "https://ntfy.sh"
ntfy_topic = ""
title = "Hearth"
quiet_hours = "23:00-08:00"   # warnings wait until morning; critical alerts always go out
timezone = "America/Denver"
grace_critical = 90           # seconds an issue has to last before it's sent
grace_warning = 300
remind_hours = 6              # repeat critical alerts while they last (0 = never)
# healthchecks.io ping URL. Pinged every minute; healthchecks.io alerts you when the pings stop (server down).
heartbeat_url = ""

# Other machines to watch. Each runs the Hearth agent (role = "agent") and is polled every 30 s. Its units and game
# servers come from its own config. token_file holds a copy of that machine's /etc/hearth/token (root:hearth 640).
# [[host]]
# id = "box2"                       # lowercase letters, digits and dashes; prefixes its units and history keys
# name = "box2"
# url = "http://100.64.0.2:8011"    # the agent's [agent] listen address
# token_file = "/etc/hearth/hosts/box2.token"
# unreachable_seconds = 90          # no answer for this long = a critical "box2 is unreachable" alert

# ---------- On an agent machine ----------
# role = "agent"
# name = "box2"
# disks, smart, [[service]], [[game]] and [cellar] as above (the server shows this machine's backups when its cellar
# state directory exists). [pihole], [public_ip], [rules] and [alerts] are ignored: the server applies its own rules
# and sends the alerts.
# [agent]
# listen = "100.64.0.2:8011"        # this machine's tailnet address; nothing else is listened on
# allow = ["100.64.0.1"]            # the server's tailnet address (loopback is always allowed)
# token_file = "/etc/hearth/token"
