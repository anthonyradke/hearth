[project]
name = "hearth"
version = "0.1.0"
description = "Status, history, alerts and controls for one home server"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
